<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 282"
     class="dceasy-pipeline" role="img" aria-label="DCEasy processing pipeline, with step 3 highlighted as AutoAIF's scope"
     font-family="'IBM Plex Sans', Helvetica, sans-serif">
    <!-- connectors: 1→2→3, wrapping down and back to 4→5→6 -->
    <g stroke="currentColor" fill="none" opacity=".45" stroke-width="1.5">
      <path d="M254 58 H282"/>
      <path d="M534 58 H562"/>
      <path d="M254 224 H282"/>
      <path d="M534 224 H562"/>
      <path d="M690 106 V116 Q690 128 678 128 H142 Q130 128 130 140 V168" stroke-linecap="round"/>
    </g>
    <g fill="currentColor" opacity=".45">
      <path d="M281 52.5 L290 58 L281 63.5 Z"/>
      <path d="M561 52.5 L570 58 L561 63.5 Z"/>
      <path d="M281 218.5 L290 224 L281 229.5 Z"/>
      <path d="M561 218.5 L570 224 L561 229.5 Z"/>
      <path d="M124.5 167 L130 176 L135.5 167 Z"/>
    </g>
    <g>
      <rect x="10" y="10" width="240" height="96" rx="4" fill="none" stroke="currentColor" stroke-width="1" stroke-opacity=".35"/>
      <text x="30" y="42" fill="currentColor" font-size="17" font-weight="600">1 · Convert</text>
      <text x="30" y="64" fill="currentColor" opacity=".62" font-size="13">DICOM → BIDS</text>
      <text x="30" y="86" fill="currentColor" opacity=".8" font-family="JetBrains Mono, monospace" font-size="12.5">dce2bids</text>
    </g>
    <g>
      <rect x="290" y="10" width="240" height="96" rx="4" fill="none" stroke="currentColor" stroke-width="1" stroke-opacity=".35"/>
      <text x="310" y="42" fill="currentColor" font-size="17" font-weight="600">2 · Preprocess</text>
      <text x="310" y="64" fill="currentColor" opacity=".62" font-size="13">motion · bias</text>
      <text x="310" y="86" fill="currentColor" opacity=".8" font-family="JetBrains Mono, monospace" font-size="12.5">DCEPrep</text>
    </g>
    <g class="dceasy-pipeline-on">
      <rect x="570" y="10" width="240" height="96" rx="4" fill="#16707f" fill-opacity=".12" stroke="#16707f" stroke-width="2.5" stroke-opacity="1"/>
      <text x="590" y="42" fill="currentColor" font-size="17" font-weight="600">3 · AIF</text>
      <text x="590" y="64" fill="currentColor" opacity=".62" font-size="13">input function</text>
      <text x="590" y="86" fill="#16707f" opacity="1" font-family="JetBrains Mono, monospace" font-size="12.5">AutoAIF / AIFArtist</text>
    </g>
    <g>
      <rect x="10" y="176" width="240" height="96" rx="4" fill="none" stroke="currentColor" stroke-width="1" stroke-opacity=".35"/>
      <text x="30" y="208" fill="currentColor" font-size="17" font-weight="600">4 · T1 map</text>
      <text x="30" y="230" fill="currentColor" opacity=".62" font-size="13">VFA / IR</text>
      <text x="30" y="252" fill="currentColor" opacity=".8" font-family="JetBrains Mono, monospace" font-size="12.5">parametric_scripts</text>
    </g>
    <g>
      <rect x="290" y="176" width="240" height="96" rx="4" fill="none" stroke="currentColor" stroke-width="1" stroke-opacity=".35"/>
      <text x="310" y="208" fill="currentColor" font-size="17" font-weight="600">5 · PK fit</text>
      <text x="310" y="230" fill="currentColor" opacity=".62" font-size="13">Ktrans · ve · vp</text>
      <text x="310" y="252" fill="currentColor" opacity=".8" font-family="JetBrains Mono, monospace" font-size="12.5">ROCKETSHIP + Gpufit</text>
    </g>
    <g>
      <rect x="570" y="176" width="240" height="96" rx="4" fill="none" stroke="currentColor" stroke-width="1" stroke-opacity=".35"/>
      <text x="590" y="208" fill="currentColor" font-size="17" font-weight="600">6 · Analyze</text>
      <text x="590" y="230" fill="currentColor" opacity=".62" font-size="13">compare · QC</text>
      <text x="590" y="252" fill="currentColor" opacity=".8" font-family="JetBrains Mono, monospace" font-size="12.5">ROCKETSHIP</text>
    </g>
</svg>
