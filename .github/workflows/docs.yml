name: docs

# Builds the hub with Zensical and publishes it to GitHub Pages.
#
# Pages must be set to "GitHub Actions" as its source (Settings › Pages ›
# Build and deployment). Until it is, this workflow builds but the deploy step
# has nothing to publish to.
#
# The custom domain lives in docs/CNAME so that it ends up inside the artifact.
# There is deliberately no CNAME at the repository root: under the Actions
# source it is never read, and keeping one invites the two copies to disagree.
#
# Action majors are kept current because GitHub retires the Node runtime they
# run on, not because this workflow needs new features. All four below are on
# node24; upload-pages-artifact pins upload-artifact internally.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Queue deploys rather than cancelling them: a cancelled run still counts as a
# completed deployment to Pages, which silently leaves the site on the older
# build. This bit us on ROCKETSHIP.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: zensical build --strict
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
